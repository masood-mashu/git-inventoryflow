name: dead-stock-detector
version: 1.0.0
description: "Identifies dormant inventory SKUs with zero units sold over a specified observation window"
input_schema:
  type: object
  properties:
    days_without_sale:
      type: string
      description: "Number of consecutive days since last retail transaction for this SKU"
  required:
    - days_without_sale
implementation:
  type: script
  path: dead_stock_detector.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
